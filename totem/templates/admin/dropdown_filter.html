{% load i18n %}
<details data-filter-title="{{ title }}" open>
  <summary>
    {% blocktranslate with filter_title=title %}By {{ filter_title }}{% endblocktranslate %}
  </summary>
  <script nonce="{{ csp_nonce }}">
    function safeDropdownRedirect(url) {
      // Create an anchor element to parse the URL
      var a = document.createElement("a")
      a.href = url
      // Check if the URL is safe (e.g., same origin or allowed domains)
      if (a.origin === window.location.origin) {
        window.location.href = url
      } else {
        console.error("Unsafe URL blocked:", url)
      }
    }
    document.addEventListener("DOMContentLoaded", function () {
      const select = document.getElementById("filter-select-{{ title }}")
      if (select) {
        select.addEventListener("change", function () {
          safeDropdownRedirect(select.value)
        })
      }
    })
  </script>
  <div style="padding: 0 15px 10px 15px;">
    <select
      style="width: 100%"
      id="filter-select-{{ title }}"
      class="form-control">
      {% for choice in choices %}
        <option
          value="{{ choice.query_string|iriencode }}"
          {% if choice.selected %}selected{% endif %}>
          {{ choice.display }}
        </option>
      {% endfor %}
    </select>
  </div>
</details>
