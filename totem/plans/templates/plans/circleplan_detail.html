{% extends "base.html" %}
{% block title %}
  Plans - {{ object.name }}
{% endblock title %}
{% block content %}
  <div class="mx-auto max-w-4xl px-5 pt-8 pb-20 md:pt-12">
    <a
      class="link inline-flex items-center gap-2 text-sm font-medium underline-offset-4"
      href="{% url 'plans:list' %}">
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">
        <path d="M19 12H5m7-7-7 7 7 7" />
      </svg>
      All self-guided plans
    </a>
    <article
      class="mt-8 overflow-hidden rounded-3xl bg-white shadow-sm ring-1 ring-gray-900/5">
      <header class="bg-tblue/30 p-7 md:p-12">
        <p class="mb-4 text-sm font-semibold tracking-widest uppercase">
          Self-guided plan
        </p>
        <h1
          class="text-3xl leading-tight font-semibold tracking-tight wrap-break-word md:text-5xl">
          {{ object.name }}
        </h1>
        <p class="text-tdeepgray mt-6 text-lg leading-8 wrap-break-word">
          {{ object.description }}
        </p>
      </header>
      <div class="tprose max-w-none p-7 wrap-break-word md:p-12">
        {{ object.content_html | safe }}
      </div>
    </article>
  </div>
{% endblock content %}
